# Development config for the author's clock: builds from the files in this repo.
# For Home Assistant's ESPHome Device Builder use ecowatch-julia-ha.yaml instead.
substitutions:
  name: ecowatch-julia
  friendly_name: EcoWatch Julia

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

external_components:
  - source:
      type: local
      path: ../components
    components: [ecowatch]

packages:
  ecowatch: !include ecowatch-julia-base.yaml

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret wifi_hotspot_password

captive_portal:
