# GPIO discovery firmware for the EcoWatch Julia.
# Every free GPIO is reported as a binary sensor and ADC-capable pins as voltages.
# Flash it, open the web UI at http://ecowatch-probe.local and watch what changes while you
# press buttons, flip SW2, cover the front, plug/unplug USB vs. battery, etc.
#
# Display pins (5, 16, 18, 22, 23) are driven so the backlight can be tested.
# Back up the stock flash first! (tools/backup_flash.ps1)

esphome:
  name: ecowatch-probe

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "EcoWatch Probe"

captive_portal:
web_server:
  port: 80
ota:
  - platform: esphome
api:

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO22

light:
  - platform: monochromatic
    name: "Backlight (GPIO22)"
    output: backlight_pwm

# Input-only / general GPIOs. Pull-ups off so we see the real level of the net.
binary_sensor:
  - { platform: gpio, name: "GPIO2",  pin: { number: GPIO2,  mode: INPUT } }
  - { platform: gpio, name: "GPIO4",  pin: { number: GPIO4,  mode: INPUT } }
  - { platform: gpio, name: "GPIO12", pin: { number: GPIO12, mode: INPUT, ignore_strapping_warning: true } }
  - { platform: gpio, name: "GPIO13", pin: { number: GPIO13, mode: INPUT } }
  - { platform: gpio, name: "GPIO14", pin: { number: GPIO14, mode: INPUT } }
  - { platform: gpio, name: "GPIO15", pin: { number: GPIO15, mode: INPUT, ignore_strapping_warning: true } }
  - { platform: gpio, name: "GPIO17", pin: { number: GPIO17, mode: INPUT } }
  - { platform: gpio, name: "GPIO19", pin: { number: GPIO19, mode: INPUT } }
  - { platform: gpio, name: "GPIO21", pin: { number: GPIO21, mode: INPUT } }
  - { platform: gpio, name: "GPIO25", pin: { number: GPIO25, mode: INPUT } }
  - { platform: gpio, name: "GPIO26", pin: { number: GPIO26, mode: INPUT } }
  - { platform: gpio, name: "GPIO27", pin: { number: GPIO27, mode: INPUT } }
  - { platform: gpio, name: "GPIO0 (BOOT)", pin: { number: GPIO0, mode: INPUT, inverted: true, ignore_strapping_warning: true } }

sensor:
  - { platform: adc, name: "ADC GPIO32", pin: GPIO32, attenuation: 12db, update_interval: 2s }
  - { platform: adc, name: "ADC GPIO33", pin: GPIO33, attenuation: 12db, update_interval: 2s }
  - { platform: adc, name: "ADC GPIO34", pin: GPIO34, attenuation: 12db, update_interval: 2s }
  - { platform: adc, name: "ADC GPIO35", pin: GPIO35, attenuation: 12db, update_interval: 2s }
  - { platform: adc, name: "ADC GPIO36", pin: GPIO36, attenuation: 12db, update_interval: 2s }
  - { platform: adc, name: "ADC GPIO39", pin: GPIO39, attenuation: 12db, update_interval: 2s }
  - { platform: wifi_signal, name: "WiFi signal", update_interval: 30s }

# To test whether a GPIO drives something (e.g. an LED ring data line), move it from the
# binary_sensor list above to a switch here and toggle it from the web UI:
# switch:
#   - { platform: gpio, name: "Drive GPIO27", pin: GPIO27 }
